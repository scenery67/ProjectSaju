spring:
  application:
    name: saju-backend
  lifecycle:
    # Give in-flight requests time to finish during a Fly.io rolling deploy
    # before the old machine's context is force-closed.
    timeout-per-shutdown-phase: 20s
  datasource:
    # Local Postgres started via `docker-compose up -d` at repo root.
    # 저장소 루트의 docker-compose로 띄우는 로컬 Postgres 접속 정보.
    # Host port is 5433 (not the default 5432) to avoid clashing with a
    # natively-installed PostgreSQL service some machines already run there.
    # Any real (cloud) environment must override these via env vars — never commit real credentials.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/saju}
    username: ${DB_USERNAME:saju}
    password: ${DB_PASSWORD:saju}
  jpa:
    hibernate:
      # Flyway owns the schema now. Hibernate only validates the entities
      # match what Flyway created — it never alters the schema itself.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:placeholder}
            client-secret: ${KAKAO_CLIENT_SECRET:placeholder}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: [openid, profile]
          naver:
            client-id: ${NAVER_CLIENT_ID:placeholder}
            client-secret: ${NAVER_CLIENT_SECRET:placeholder}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: [name]
        # 카카오/네이버는 Spring Security의 기본 제공 provider 목록(CommonOAuth2Provider)에
        # 없어서 엔드포인트를 직접 지정해야 한다. 구글은 기본 제공이라 registration만 있으면 된다.
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # 네이버 응답은 실제 필드가 response 하위에 한 번 더 감싸져 있다.
            user-name-attribute: response

server:
  port: 8080
  # On SIGTERM, stop accepting new requests but let in-flight ones finish
  # (up to spring.lifecycle.timeout-per-shutdown-phase) instead of cutting
  # them off immediately — required for zero-downtime rolling deploys.
  shutdown: graceful
  # Fly.io terminates TLS at its edge proxy and forwards plain HTTP internally,
  # setting X-Forwarded-Proto: https on the request. Without this, Spring
  # doesn't trust that header, so it thinks every request is http — breaking
  # any absolute URL it builds itself, notably OAuth2's "{baseUrl}" redirect-uri
  # placeholder (ends up http://..., which never matches the https:// URI
  # registered with Kakao/Google/Naver, however correctly configured).
  forward-headers-strategy: framework

# Frontend origin allowed for local CORS (Vite dev server default port).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Where the OAuth2 login redirect hands the issued JWT back to (HashRouter,
  # so the path goes after '#'). Local dev default matches Vite's port; real
  # deploys must override via FRONTEND_URL.
  frontend-url: ${FRONTEND_URL:http://localhost:5173/}
  jwt:
    # Local-dev-only default — never used as-is in any real environment.
    # A real deploy must override via JWT_SECRET (32+ bytes, HS256 requires it).
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-please-change-me-0123456789}
  dev-admin-bypass:
    # 상용화 전, 실제 OAuth 앱 등록 없이 팀이 관리자 권한으로 써볼 수 있게 하는
    # 임시 우회 로그인(/api/auth/dev-admin-login) 활성화 여부. 기본값 false —
    # 상용화 시점엔 반드시 이 값을 켜지 않은 채로 둬야 한다(또는 Fly secret 제거).
    enabled: ${ADMIN_BYPASS_ENABLED:false}
    # 위 enabled가 true여도 요청의 ?key= 값이 이 값과 일치해야만 동작한다 —
    # /api/auth/dev-admin-login은 permitAll이라 URL만 알면 누구나 부를 수
    # 있어서, enabled 플래그 하나만으로는 "아무나 관리자가 되는" 문제가 있었다.
    # 비워두면(기본값) enabled를 켜도 항상 막힌다.
    secret: ${ADMIN_BYPASS_SECRET:}
  openai:
    # LLM 사주 상담 기능이 실제로 호출하는 API 키. 비워두면(기본값)
    # OpenAiClient.isConfigured()가 false를 반환하고 상담 호출은 502로
    # 실패한다(소비된 크레딧은 자동 환급됨) — 로컬/CI에는 설정하지 않는다.
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

management:
  endpoints:
    web:
      exposure:
        # Fly.io health check probes /actuator/health only — keep other endpoints unexposed.
        include: health
  endpoint:
    health:
      show-details: never

---
# 운영 배포는 SPRING_PROFILES_ACTIVE=prod로 이 문서를 활성화한다(Fly secret).
# app.jwt.secret에 기본값을 안 둬서, JWT_SECRET을 깜빡 설정 안 하면 그
# 유명한 로컬 기본값으로 조용히 뜨는 대신 부팅 자체가 실패한다 — 시크릿
# 누락이 "auth 우회 가능한 운영 배포"가 아니라 "즉시 눈에 띄는 배포 실패"가
# 되도록 한다.
spring:
  config:
    activate:
      on-profile: prod
app:
  jwt:
    secret: ${JWT_SECRET}
