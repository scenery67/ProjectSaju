spring:
  application:
    name: saju-backend
  lifecycle:
    # Give in-flight requests time to finish during a Fly.io rolling deploy
    # before the old machine's context is force-closed.
    timeout-per-shutdown-phase: 20s
  datasource:
    # Local Postgres started via `docker-compose up -d` at repo root.
    # 저장소 루트의 docker-compose로 띄우는 로컬 Postgres 접속 정보.
    # Host port is 5433 (not the default 5432) to avoid clashing with a
    # natively-installed PostgreSQL service some machines already run there.
    # Any real (cloud) environment must override these via env vars — never commit real credentials.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/saju}
    username: ${DB_USERNAME:saju}
    password: ${DB_PASSWORD:saju}
  jpa:
    hibernate:
      # Flyway owns the schema now. Hibernate only validates the entities
      # match what Flyway created — it never alters the schema itself.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:placeholder}
            client-secret: ${KAKAO_CLIENT_SECRET:placeholder}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: [openid, profile]
          naver:
            client-id: ${NAVER_CLIENT_ID:placeholder}
            client-secret: ${NAVER_CLIENT_SECRET:placeholder}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: [name]
        # 카카오/네이버는 Spring Security의 기본 제공 provider 목록(CommonOAuth2Provider)에
        # 없어서 엔드포인트를 직접 지정해야 한다. 구글은 기본 제공이라 registration만 있으면 된다.
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # 네이버 응답은 실제 필드가 response 하위에 한 번 더 감싸져 있다.
            user-name-attribute: response

server:
  port: 8080
  # On SIGTERM, stop accepting new requests but let in-flight ones finish
  # (up to spring.lifecycle.timeout-per-shutdown-phase) instead of cutting
  # them off immediately — required for zero-downtime rolling deploys.
  shutdown: graceful

# Frontend origin allowed for local CORS (Vite dev server default port).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Where the OAuth2 login redirect hands the issued JWT back to (HashRouter,
  # so the path goes after '#'). Local dev default matches Vite's port; real
  # deploys must override via FRONTEND_URL.
  frontend-url: ${FRONTEND_URL:http://localhost:5173/}
  jwt:
    # Local-dev-only default — never used as-is in any real environment.
    # A real deploy must override via JWT_SECRET (32+ bytes, HS256 requires it).
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-please-change-me-0123456789}

management:
  endpoints:
    web:
      exposure:
        # Fly.io health check probes /actuator/health only — keep other endpoints unexposed.
        include: health
  endpoint:
    health:
      show-details: never
