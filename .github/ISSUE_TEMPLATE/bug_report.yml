name: 버그 리포트 / Bug report
description: 동작이 기대와 다를 때
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **개인정보를 적지 마세요.** 실제 사람의 생년월일·이름·연락처 대신 가공한 값으로 재현 절차를 적어주세요.
        보안 취약점은 이슈가 아니라 비공개 보안 신고로 알려주세요.

  - type: textarea
    id: summary
    attributes:
      label: 무슨 일이 일어났나
      placeholder: 궁합 결과 화면에서 오행 그래프가 비어 있음
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - frontend (화면)
        - backend (API)
        - saju (명리 계산 결과가 틀림)
        - infra / 배포
        - 모르겠음
    validations:
      required: true

  - type: input
    id: input-case
    attributes:
      label: 입력값 (가공한 값으로)
      description: 명리 계산 문제면 양/음력, 윤달, 시각까지 적어주세요.
      placeholder: "1990-01-01 23:30, 음력, 윤달 아님, 여성"

  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: "로컬 / 배포, Chrome 141, iPhone Safari 등"

  - type: textarea
    id: logs
    attributes:
      label: 로그 · 에러 메시지
      description: 붙여넣기 전에 토큰·접속 정보·개인정보를 마스킹하세요.
      render: shell
