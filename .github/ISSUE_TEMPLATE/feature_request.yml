name: 기능 제안 / Feature request
description: 새 기능이나 개선 아이디어
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 푸는가
      description: 기능 자체보다 사용자가 겪는 불편을 먼저 적어주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방식
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - frontend (화면)
        - backend (API)
        - saju (해석 로직)
        - infra / 배포
        - 기획 · 콘텐츠
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 개인정보 영향
      options:
        - label: 새로 수집·저장하는 개인정보가 있다 (있다면 아래에 무엇을·왜·보관기간을 적어주세요)

  - type: textarea
    id: privacy-detail
    attributes:
      label: 개인정보 상세 (해당 시)

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안 · 참고 자료
