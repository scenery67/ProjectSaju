# PR 검증 워크플로 / Pull request verification.
# 배포는 deploy-backend.yml, deploy-frontend.yml이 담당한다.
name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch: {}

# 같은 브랜치의 이전 실행은 취소 / cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    # Flyway runs real migrations against the datasource on context startup
    # (and SajuBackendApplicationTests loads the full context), so the build
    # needs an actual Postgres to talk to — not just JDBC on the classpath.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saju
          POSTGRES_USER: saju
          POSTGRES_PASSWORD: saju
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saju"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/saju
      DB_USERNAME: saju
      DB_PASSWORD: saju
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: backend
        run: ./gradlew --no-daemon build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # tsc -b 가 포함되어 있어 타입 체크를 겸한다 / build also type-checks
      - name: Type check and build
        working-directory: frontend
        run: npm run build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 커밋에 들어간 키/토큰/접속 정보를 차단 / block committed credentials.
      # gitleaks-action은 조직 소유 저장소에서 GITLEAKS_LICENSE를 요구할 수 있다.
      # 라이선스가 없으면 아래 두 스텝을 지우고 "gitleaks (binary)" 스텝만 남길 것.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # 대안 / fallback: 액션 대신 바이너리로 직접 실행
      # - name: gitleaks (binary)
      #   run: |
      #     curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
      #       | tar -xz gitleaks
      #     ./gitleaks detect --source . --redact --no-banner
